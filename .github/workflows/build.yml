name: Build Fabric Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 25 manually
        run: |
          wget -q https://download.java.net/java/early_access/jdk25/latest/GPL/openjdk-25-ea+latest_linux-x64_bin.tar.gz -O jdk25.tar.gz
          mkdir -p $HOME/jdk25
          tar -xzf jdk25.tar.gz -C $HOME/jdk25 --strip-components=1
          echo "JAVA_HOME=$HOME/jdk25" >> $GITHUB_ENV
          echo "$HOME/jdk25/bin" >> $GITHUB_PATH

      - name: Verify Java version
        run: java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod with Gradle
        run: gradle build

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: redstone-meter-mod
          path: build/libs/*.jar
